<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cycle">
<title>Cycle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light dark;--bg:#f5f2fa;--card:#fff;--ink:#2b2442;--mute:#7b7494;--line:#e4def0;--per:#c9365f;--fer:#2f9e98;--acc:#6c4fc2}
@media(prefers-color-scheme:dark){:root{--bg:#15112a;--card:#201b3a;--ink:#efeaff;--mute:#a49cc4;--line:#322b52;--per:#ef5f88;--fer:#4cc3bc;--acc:#a58cf0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
main{max-width:460px;margin:0 auto;padding:18px 18px 8px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ringwrap{position:relative;width:272px;height:272px;margin:6px auto 4px}
.ringwrap svg{width:100%;height:100%}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid small{color:var(--mute);font-size:13px}
.mid b{font-size:64px;font-weight:300;line-height:1.05;letter-spacing:-2px}
.status{text-align:center;font-size:19px;font-weight:600;margin:6px 0 2px}
.note{text-align:center;color:var(--mute);font-size:14px;margin:0 0 16px;min-height:20px}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:15px;background:var(--per);color:#fff;font-weight:600;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:600}
.stat span{font-size:12px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:12px 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh button{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:18px}
.mh strong{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .w{font-size:12px;color:var(--mute);padding:4px 0}
.d{aspect-ratio:1;border:2px solid transparent;border-radius:50%;background:none;font-size:15px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.d small{font-size:9px;opacity:.6;margin-top:1px}
.d.p{background:var(--per);color:#fff;font-weight:600}
.d.pp{border:2px dashed var(--per)}
.d.f{background:color-mix(in srgb,var(--fer) 22%,transparent)}
.d.ov{border:2px solid var(--fer);background:color-mix(in srgb,var(--fer) 22%,transparent);font-weight:600}
.d.t span{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.row span:last-child{color:var(--mute)}
.lbl{font-size:13px;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button,.btns label{border:1.5px solid var(--line);background:none;border-radius:12px;padding:10px 14px;font-size:14px}
.btns .danger{color:var(--per)}
.fine{font-size:12px;color:var(--mute);line-height:1.5;margin:14px 2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;padding:14px 0;font-size:14px;color:var(--mute)}
nav button[aria-selected=true]{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav role="tablist" aria-label="Sections">
  <button role="tab" data-v="today">Today</button>
  <button role="tab" data-v="cal">Calendar</button>
  <button role="tab" data-v="hist">History</button>
</nav>

<script>
const KEY='cycle-tracker-v1', DAY=864e5, PLEN=7;
let S={days:{}};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.days)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const num=k=>{const [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const key=n=>{const d=new Date(n*DAY);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const now=new Date();
const T=num(now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()));
const fmt=(n,o)=>new Date(n*DAY).toLocaleDateString(undefined,Object.assign({timeZone:'UTC'},o));
const short={month:'short',day:'numeric'};
const isP=n=>!!(S.days[key(n)]&&S.days[key(n)].p);
const startPeriod=n=>{for(let i=0;i<PLEN;i++)S.days[key(n+i)]={p:true}};
const $app=document.getElementById('app');
let view='today', cm=new Date(Date.UTC(now.getFullYear(),now.getMonth(),1));

function analyze(){
  const ns=Object.keys(S.days).filter(k=>S.days[k].p).map(num).sort((a,b)=>a-b);
  const per=[];
  ns.forEach(n=>{const l=per[per.length-1];if(l&&n-l.end===1)l.end=n;else per.push({start:n,end:n})});
  const lens=[];
  for(let i=1;i<per.length;i++){const g=per[i].start-per[i-1].start;if(g>=15&&g<=60)lens.push(g)}
  const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  const avg=mean(lens.slice(-6))||28;
  const lastP=per[per.length-1];
  const finished=per.filter(p=>p!==lastP||T-p.end>1).map(p=>p.end-p.start+1).filter(l=>l<=10);
  const plen=Math.min(10,Math.max(2,mean(finished.slice(-6))||PLEN));
  const pred={},starts=per.map(p=>p.start);let next=null;
  if(lastP){
    for(let k=1;k<=7;k++){
      const s=lastP.start+k*avg;if(k===1)next=s;starts.push(s);
      const ov=s-14;
      for(let i=-5;i<=1;i++)pred[ov+i]='f';
      pred[ov]='ov';
      for(let i=0;i<plen;i++)pred[s+i]='pp';
    }
  }
  return{per,lens,avg,plen,pred,next,lastP,starts};
}

function ring(A,cd){
  const L=Math.max(A.avg,cd||A.avg),R=112,cx=136,cy=136;
  const arc=(from,len,col)=>`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="14" pathLength="360" stroke-dasharray="${len/L*360} 360" stroke-dashoffset="${-(from-1)/L*360}" transform="rotate(-90 ${cx} ${cy})"/>`;
  let s=`<svg viewBox="0 0 272 272" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/>`;
  if(A.lastP){
    s+=arc(A.avg-18,7,'color-mix(in srgb,var(--fer) 45%,transparent)');
    s+=arc(1,A.plen,'var(--per)');
    if(cd){const a=((cd-.5)/L)*2*Math.PI-Math.PI/2;
      s+=`<circle cx="${cx+R*Math.cos(a)}" cy="${cy+R*Math.sin(a)}" r="13" fill="var(--card)" stroke="var(--acc)" stroke-width="5"/>`}
  }
  return s+'</svg>';
}

function today(A){
  const cd=A.lastP?T-A.lastP.start+1:0;
  let st='Welcome',nt='Log the first day of your last period to start predictions.',big='–';
  if(A.lastP){
    big=cd;
    const late=A.next!==null&&T>A.next&&!isP(T)?T-A.next:0;
    if(isP(T)){let s=T;while(isP(s-1))s--;st=`Period day ${T-s+1}`;nt=`Cycle usually lasts about ${A.avg} days.`}
    else if(late>0){st=`Period ${late} day${late>1?'s':''} late`;nt=`Expected ${fmt(A.next,short)}. Log it when it starts.`}
    else if(A.pred[T]==='ov'){st='Ovulation day likely';nt='Peak fertility is estimated for today.'}
    else if(A.pred[T]==='f'){st='Fertile window';nt=`Next period expected ${fmt(A.next,short)}.`}
    else{const d=A.next-T;st=`Period in ${d} day${d===1?'':'s'}`;nt=`Expected around ${fmt(A.next,{weekday:'short',month:'short',day:'numeric'})}.`}
  }
  let btn,act;
  if(isP(T)){btn='Period ended yesterday';act='end'}
  else if(isP(T-1)){btn='Period still going today';act='cont'}
  else{btn='Period started today';act='start'}
  return `<h1>Cycle</h1><p class="sub">Private. Stored only on this device.</p>
  <div class="ringwrap">${ring(A,cd)}<div class="mid"><small>Cycle day</small><b>${big}</b></div></div>
  <div class="status">${st}</div><p class="note">${nt}</p>
  <button class="cta" data-act="${act}">${btn}</button>
  <div class="stats"><div class="stat"><b>${A.next?fmt(A.next,short):'–'}</b><span>Next period</span></div>
  <div class="stat"><b>${A.next?fmt(A.next-14,short):'–'}</b><span>Ovulation</span></div>
  <div class="stat"><b>${A.avg} d</b><span>Avg cycle</span></div></div>
  <p class="fine">Predictions are estimates from your logged cycles and improve with each one. They are not medical advice or a method of contraception.</p>`;
}

function cal(A){
  const y=cm.getUTCFullYear(),m=cm.getUTCMonth();
  const first=Math.round(Date.UTC(y,m,1)/DAY),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const off=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7;
  let g=['M','T','W','T','F','S','S'].map(d=>`<div class="w">${d}</div>`).join('')+'<div></div>'.repeat(off);
  for(let i=0;i<dim;i++){
    const n=first+i;
    let c='d';
    if(isP(n))c+=' p';else if(n>=T&&A.pred[n])c+=' '+A.pred[n];
    if(n===T)c+=' t';
    let s=-1;for(const x of A.starts)if(x<=n)s=x;
    g+=`<button class="${c}" data-n="${n}" aria-label="${fmt(n,{dateStyle:'full'})}"><span>${i+1}</span><small>${s>=0?n-s+1:'&nbsp;'}</small></button>`;
  }
  return `<div class="mh"><button data-m="-1" aria-label="Previous month">‹</button><strong>${cm.toLocaleDateString(undefined,{month:'long',year:'numeric',timeZone:'UTC'})}</strong><button data-m="1" aria-label="Next month">›</button></div>
  <div class="grid">${g}</div>
  <div class="legend"><span><i style="background:var(--per)"></i>Period</span><span><i style="border:2px dashed var(--per)"></i>Predicted</span><span><i style="background:color-mix(in srgb,var(--fer) 30%,transparent)"></i>Fertile</span><span><i style="border:2px solid var(--fer)"></i>Ovulation</span></div>
  <p class="fine">The small number under each date is the day of your cycle. Tap a day to start a period (7 days are marked) or to add or remove a single day.</p>`;
}

function hist(A){
  const rows=A.per.slice().reverse().slice(0,12).map((p,i)=>{
    const prev=A.per[A.per.length-2-i];
    const len=prev?p.start-prev.start:null;
    return `<div class="row"><span>${fmt(p.start,short)} · ${p.end-p.start+1} day${p.end>p.start?'s':''}</span><span>${len?len+'-day cycle':'first logged'}</span></div>`}).join('');
  const lo=A.lens.length?Math.min(...A.lens)+'–'+Math.max(...A.lens)+' d':'–';
  return `<h1>History</h1><p class="sub">Your cycles at a glance.</p>
  <div class="stats" style="margin:0 0 14px"><div class="stat"><b>${A.per.length}</b><span>Periods logged</span></div><div class="stat"><b>${A.plen} d</b><span>Avg period</span></div><div class="stat"><b>${lo}</b><span>Cycle range</span></div></div>
  <div class="card"><h2>Recent periods</h2>${rows||'<span class="lbl">Nothing logged yet.</span>'}</div>
  <div class="card"><h2>Backup</h2><p class="lbl" style="margin:0 0 10px">Your data lives on this device. Export a copy now and then so it is never lost.</p>
  <div class="btns"><button data-act="export">Export backup</button><label>Import backup<input type="file" accept="application/json" id="imp" hidden></label><button class="danger" data-act="wipe">Erase all</button></div></div>`;
}

function render(){
  const A=analyze();
  $app.innerHTML=view==='today'?today(A):view==='cal'?cal(A):hist(A);
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
}

document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render();scrollTo(0,0)}};
$app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.n){
    const n=+b.dataset.n;
    if(isP(n))delete S.days[key(n)];
    else if(!isP(n-1)&&!isP(n+1))startPeriod(n);
    else S.days[key(n)]={p:true};
    save();return render();
  }
  if(b.dataset.m){cm=new Date(Date.UTC(cm.getUTCFullYear(),cm.getUTCMonth()+ +b.dataset.m,1));return render()}
  const a=b.dataset.act;
  if(a==='start'){startPeriod(T);save();render()}
  else if(a==='cont'){S.days[key(T)]={p:true};save();render()}
  else if(a==='end'){for(let n=T;isP(n);n++)delete S.days[key(n)];save();render()}
  else if(a==='export'){
    const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    const l=document.createElement('a');l.href=u;l.download='cycle-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  else if(a==='wipe'&&confirm('Erase every logged day on this device? This cannot be undone.')){S={days:{}};save();render()}
};
$app.onchange=e=>{
  if(e.target.id!=='imp'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||typeof d.days!=='object')throw 0;S={days:d.days};save();render()}catch(x){alert('That file is not a valid Cycle backup.')}};
  fr.readAsText(e.target.files[0]);
};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
